# Postgres 16 + pgvector for projects 02 (memory), 04 (routing), 06 (approval).
# Usage:  docker compose up -d
# The default DATABASE_URL in .env.example matches this service.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-lab-db
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - lab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lab_pgdata:
